kind = "mobile"
previewPath = "/"
title = "Data AI"
version = "1.0.0"
id = "artifacts/data-ai"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 20068

[services.development]
run = "pnpm --filter @workspace/data-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/data-ai", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/data-ai", "run", "serve" ]

[services.env]
PORT = "20068"
BASE_PATH = "/"
